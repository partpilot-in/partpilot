[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
calamine = "0.31"
clap = { version = "4", features = ["derive", "env"] }
comfy-table = "7"
csv = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "partpilot"
path = "src/main.rs"
