services:
  postgres:
    image: postgres:16-alpine
    container_name: partpilot-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: partpilot-redis-prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword}
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: partpilot-server-prod
    restart: always
    ports:
      - "${PORT:-8080}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL}
      DIGIKEY_CLIENT_ID: ${DIGIKEY_CLIENT_ID}
      DIGIKEY_CLIENT_SECRET: ${DIGIKEY_CLIENT_SECRET}
      DIGIKEY_ACCOUNT_ID: ${DIGIKEY_ACCOUNT_ID}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  feed:
    build:
      context: .
      dockerfile: Dockerfile.feed
    container_name: partpilot-feed-prod
    restart: always
    ports:
      - "${FEED_PORT:-8090}:8090"
    environment:
      FEED_HOST: 0.0.0.0
      FEED_PORT: 8090
      FEED_CORS_ALLOWED_ORIGINS: ${FEED_CORS_ALLOWED_ORIGINS:-*}

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: partpilot-client-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  postgres_prod_data:
  redis_prod_data:
